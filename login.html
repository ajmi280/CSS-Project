<!DOCTYPE html>
<html>
<head>
<style>
body {
  margin: 0;
}
.container {
  display: flex;
  height: 100vh;
}
.left {
  width: 50%;
  background: linear-gradient(#b9c6d3, #f0c27b);
}
.right {
  width: 50%;
  padding: 40px;
}
@media (max-width: 768px) {
  .left {
    display: none;
  }
  .right {
    width: 100%;
  }
}
</style>
</head>
<body>
<div class="container">
<div class="left"></div>
<div class="right">
<h2 style="color: brown;">Login Form</h2>
Email:
<input type ="email"style="width: 100%;padding: 8px;margin: 8px 0;">
Password:
<input type ="password" style="width: 100%;padding: 8px;margin: 8px 0;">
<input type="checkbox"> Remember Me<br><br>
<button style=" width: 100%;padding: 10px;background-color: coral;color: white;border: none;">Login</button>
</div>
</body>
</html>
